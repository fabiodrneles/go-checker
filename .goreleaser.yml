# .goreleaser.yml
version: 2

project_name: go-checker

# -------------------------------
# Compilação
# -------------------------------
builds:
  - env:
      - CGO_ENABLED=0
    main: ./main.go
    binary: go-checker
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version=v{{.Version}}
      - -X main.commit={{.ShortCommit}}

# -------------------------------
# Arquivos
# -------------------------------
archives:
  - id: release-archive
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      - examples/*

# -------------------------------
# Imagem Docker (spec 010 FR-2)
# -------------------------------
dockers_v2:
  - images:
      - ghcr.io/fabiodrneles/go-checker
    tags:
      - "v{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: go-checker
      org.opencontainers.image.description: Health checks for websites and APIs, from your terminal or your CI
      org.opencontainers.image.source: https://github.com/fabiodrneles/go-checker
      org.opencontainers.image.version: "v{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

# -------------------------------
# Checksums
# -------------------------------
checksum:
  name_template: checksums.txt
  algorithm: sha256

# -------------------------------
# Snapshots
# -------------------------------
snapshot:
  version_template: "{{ incpatch .Version }}-next"

# -------------------------------
# Changelog
# -------------------------------
changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'Merge pull request'
      - 'Merge branch'

# -------------------------------
# Release
# -------------------------------
release:
  prerelease: auto
